name: Build & Deploy to MSF

on:
  push:
    branches: [main]
  workflow_dispatch:  # 支持手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'corretto'
          cache: 'maven'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # === 构建并上传 Risk Job ===
      - name: Build Risk Job
        run: mvn clean package -Paws,risk -DskipTests -q

      - name: Upload Risk JAR to S3
        run: |
          aws s3 cp target/flink-rds-cdc-print-demo-1.0-SNAPSHOT.jar \
            s3://lib-lkx/msf/featurestore-risk-1.0-SNAPSHOT.jar

      # === 构建并上传 Recommend Job ===
      - name: Build Recommend Job
        run: mvn clean package -Paws,recommend -DskipTests -q

      - name: Upload Recommend JAR to S3
        run: |
          aws s3 cp target/flink-rds-cdc-print-demo-1.0-SNAPSHOT.jar \
            s3://lib-lkx/msf/featurestore-recommend-1.0-SNAPSHOT.jar

      - name: Deploy complete
        run: |
          echo "✅ 两个 JAR 已上传到 S3"
          echo "⚠️  请手动在 MSF 控制台创建新版本并启动应用"
          echo "   - Risk: s3://lib-lkx/msf/featurestore-risk-1.0-SNAPSHOT.jar"
          echo "   - Recommend: s3://lib-lkx/msf/featurestore-recommend-1.0-SNAPSHOT.jar"
